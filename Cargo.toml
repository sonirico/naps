[package]
name = "naps"
version = "1.0.0"
edition = "2024"
rust-version = "1.99"
description = "NATS server proxy service to relay and forward custom topics and subjects"
homepage = "https://github.com/sonirico/naps"
repository = "https://github.com/sonirico/naps"
readme = "README.md"
keywords = ["nats", "nats-io", "relay", "proxy", "forward"]
categories = ["network-programming"]
license = "MIT"
exclude = [".github", "charts", "docs", "e2e", "scripts", "tests", "Dockerfile", ".dockerignore", "justfile"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-nats = "0.51"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures = "0.3"
bytes = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
rquickjs = { version = "0.14", features = ["array-buffer"] }
oxc_allocator = "=0.156.0"
oxc_parser = "=0.156.0"
oxc_semantic = "=0.156.0"
oxc_transformer = "=0.156.0"
oxc_codegen = "=0.156.0"
oxc_span = "=0.156.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
mlua = { version = "0.12", features = ["luau", "vendored"] }
extism = "1"
serde_json = "1"
base64 = "0.22"
axum = "0.8"
prometheus-client = "0.25"

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3"
wat = "1"
testcontainers = "0.28.0"
reqwest = { version = "0.13.5", default-features = false }
